spring:
  datasource:
    url: jdbc:h2:mem:car_insurance_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: false

jwt:
  secret: my-super-secret-key-that-is-at-least-32-characters-long
  expiration: 7200000