services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_insurance
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - car_insurance_postgres_data:/var/lib/postgresql/data

volumes:
  car_insurance_postgres_data:
    external: true
